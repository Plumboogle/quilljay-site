<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUILLJAY — Market Opens Soon</title>
<meta name="description" content="QUILLJAY. $1K to $1M. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05080A;
    --panel: #0B1114;
    --line: #14211F;
    --up: #22E07A;
    --up-dim: #0F6B3A;
    --text: #E8F2EC;
    --muted: #6E8580;
    --amber: #F5B841;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    text-transform: uppercase;
  }
  /* Ticker tapes */
  .tape {
    border-block: 1px solid var(--line);
    background: var(--panel);
    overflow: hidden;
    white-space: nowrap;
    font-size: 13px;
    letter-spacing: 0.06em;
    position: relative;
    z-index: 2;
  }
  .tape .track {
    display: inline-flex;
    gap: 36px;
    padding: 10px 0;
    animation: scroll 38s linear infinite;
  }
  .tape.rev .track { animation-direction: reverse; animation-duration: 46s; }
  .tick b { color: var(--text); font-weight: 800; margin-right: 8px; }
  .tick .px { color: var(--muted); margin-right: 8px; }
  .tick .chg { color: var(--up); font-weight: 600; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* Hero */
  .stage {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    padding: 48px 20px;
  }
  canvas#chart {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  .grid {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 50%, #000 40%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 40%, transparent 85%);
    opacity: 0.6;
  }
  .content {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    letter-spacing: 0.18em;
    color: var(--amber);
    border: 1px solid rgba(245,184,65,.35);
    padding: 8px 14px;
    align-self: flex-start;
    background: rgba(245,184,65,.06);
  }
  .status::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber);
    animation: blink 1.4s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  h1 {
    font-family: 'Anton', 'Impact', 'Arial Narrow', sans-serif;
    font-weight: 400;
    font-size: clamp(64px, 18vw, 240px);
    line-height: 0.86;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--text);
  }
  h1 .sym { color: var(--up); }
  .quote {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 18px;
    font-variant-numeric: tabular-nums;
  }
  .quote .from { font-size: clamp(22px, 4vw, 34px); color: var(--muted); font-weight: 600; }
  .quote .arrow { font-size: clamp(22px, 4vw, 34px); color: var(--up); }
  .quote .to { font-size: clamp(30px, 6vw, 56px); color: var(--up); font-weight: 800; text-shadow: 0 0 24px rgba(34,224,122,.35); }
  .quote .pct {
    font-size: 14px; font-weight: 800; color: var(--bg); background: var(--up);
    padding: 4px 8px; letter-spacing: 0.04em;
  }
  .row {
    display: flex; flex-wrap: wrap; gap: 12px 28px;
    font-size: 13px; color: var(--muted); letter-spacing: 0.08em;
  }
  .row span b { color: var(--text); font-weight: 600; }
  .contact {
    margin-top: 8px;
    align-self: flex-start;
    color: var(--bg);
    background: var(--up);
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.08em;
    padding: 14px 20px;
    text-transform: lowercase;
    transition: transform .15s, box-shadow .15s;
  }
  .contact:hover, .contact:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(34,224,122,.3);
    outline: none;
  }
  footer {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; font-size: 12px; color: var(--muted); letter-spacing: 0.1em;
    border-top: 1px solid var(--line);
    position: relative; z-index: 2; background: var(--bg);
  }
  @media (prefers-reduced-motion: reduce) {
    .tape .track, .status::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="tape" aria-hidden="true"><div class="track" id="tapeA"></div></div>

  <section class="stage">
    <div class="grid"></div>
    <canvas id="chart" aria-hidden="true"></canvas>
    <div class="content">
      <span class="status">Pre-market &middot; Opening soon</span>
      <h1>QUILL<span class="sym">JAY</span></h1>
      <div class="quote" aria-label="From one thousand dollars to one million dollars">
        <span class="from">$1K</span>
        <span class="arrow">&#9650;</span>
        <span class="to">$1M</span>
        <span class="pct">+99,900%</span>
      </div>
      <div class="row">
        <span>Ticker <b>QWJ</b></span>
        <span>Status <b>Coming soon</b></span>
        <span>Exchange <b>quilljay.com</b></span>
      </div>
    </div>
  </section>

  <div class="tape rev" aria-hidden="true"><div class="track" id="tapeB"></div></div>
  <footer><span>&copy; 2026 QUILLJAY</span><span>Not a real stock. Not financial advice.</span></footer>

<script>
  // Made-up tickers, all trending up
  const syms = ['QWJ','QUIL','INKX','PAGE','WRTE','JAYQ','PLUM','DRFT','NIBB','FOLO','SCRB','QLLZ','TRIO','KXJ','VLLM','ZQJ'];
  function tapeHTML(seed) {
    let s = seed, out = '';
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (const sym of syms) {
      const px = (10 + rnd() * 490).toFixed(2);
      const ch = (0.4 + rnd() * 18).toFixed(2);
      out += `<span class="tick"><b>${sym}</b><span class="px">${px}</span><span class="chg">&#9650; ${ch}%</span></span>`;
    }
    return out + out; // doubled for seamless loop
  }
  document.getElementById('tapeA').innerHTML = tapeHTML(7);
  document.getElementById('tapeB').innerHTML = tapeHTML(42);

  // Rising chart line behind the hero
  const c = document.getElementById('chart');
  const ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pts = [], progress = 0;
  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = c.clientWidth, h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(40, Math.floor(w / 14));
    let s = 13, y = h * 0.85;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    pts = [];
    for (let i = 0; i <= n; i++) {
      const x = (i / n) * w;
      const drift = (h * 0.7) / n;          // overall climb
      y += (rnd() - 0.62) * h * 0.06 - drift * 0.35;
      y = Math.max(h * 0.12, Math.min(h * 0.92, y));
      pts.push([x, y]);
    }
    pts[pts.length - 1][1] = h * 0.14;
  }
  function draw() {
    const w = c.clientWidth, h = c.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const upto = Math.max(2, Math.floor(pts.length * progress));
    const seg = pts.slice(0, upto);
    // fill
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(34,224,122,0.22)');
    g.addColorStop(1, 'rgba(34,224,122,0)');
    ctx.beginPath();
    ctx.moveTo(seg[0][0], h);
    seg.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(seg[seg.length - 1][0], h);
    ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    // line
    ctx.beginPath();
    seg.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = '#22E07A'; ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(34,224,122,.6)'; ctx.shadowBlur = 12;
    ctx.stroke(); ctx.shadowBlur = 0;
    // head dot
    const [hx, hy] = seg[seg.length - 1];
    ctx.beginPath(); ctx.arc(hx, hy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#22E07A'; ctx.fill();
  }
  function loop() {
    progress = Math.min(1, progress + 0.006);
    draw();
    if (progress < 1) requestAnimationFrame(loop);
  }
  function start() { build(); progress = reduce ? 1 : 0; reduce ? draw() : loop(); }
  addEventListener('resize', () => { build(); draw(); });
  start();
</script>
</body>
</html>
