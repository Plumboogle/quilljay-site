<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuillJay — Coming Soon</title>
<meta name="description" content="QuillJay. From $1K to $1M. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B0E1A;
    --ink-2: #131833;
    --paper: #F2EFE6;
    --muted: #9AA0BF;
    --jay: #3D7BFF;
    --jay-soft: #8FB3FF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 80% -10%, #1C2A66 0%, transparent 60%),
                radial-gradient(900px 600px at -10% 110%, #1A1440 0%, transparent 55%),
                var(--ink);
    color: var(--paper);
    font-family: 'DM Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding: 0 24px;
    overflow-x: hidden;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 64px 0 32px;
    gap: 28px;
  }
  .tag {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--jay-soft);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .tag::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--jay);
    box-shadow: 0 0 0 0 rgba(61,123,255,.6);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61,123,255,.55); }
    70% { box-shadow: 0 0 0 14px rgba(61,123,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,123,255,0); }
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(44px, 13vw, 200px);
    line-height: 0.88;
    letter-spacing: -0.04em;
    margin: 0;
    background: linear-gradient(100deg, var(--paper) 0%, var(--paper) 45%, var(--jay-soft) 75%, var(--jay) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .range {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: clamp(26px, 5vw, 48px);
    letter-spacing: -0.01em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.4em;
    flex-wrap: wrap;
  }
  .range .arrow { color: var(--jay); }
  .soon {
    font-size: 18px;
    color: var(--muted);
    margin: 0;
    max-width: 34ch;
    line-height: 1.5;
  }
  .contact {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    border: 1px solid rgba(143,179,255,.35);
    border-radius: 999px;
    color: var(--paper);
    text-decoration: none;
    font-weight: 500;
    font-size: 16px;
    transition: background .2s, border-color .2s;
  }
  .contact:hover, .contact:focus-visible {
    background: rgba(61,123,255,.15);
    border-color: var(--jay);
    outline: none;
  }
  footer {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 0 32px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  @media (prefers-reduced-motion: reduce) {
    .tag::before { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <span class="tag">Coming soon</span>
    <h1>QuillJay</h1>
    <p class="range"><span>$1K</span><span class="arrow">&rarr;</span><span>$1M</span></p>
    <p class="soon">Something new is on the way. Check back soon.</p>
    <a class="contact" href="mailto:team@quilljay.com">team@quilljay.com</a>
  </main>
  <footer>
    <span>&copy; 2026 QuillJay</span>
    <span>quilljay.com</span>
  </footer>
</body>
</html>
